# Pages CMS (pagescms.org) — 작가용 편집 화면 정의.
# 이 저장소를 소유한 GitHub 계정으로 로그인한다.
# 저장하면 GitHub Actions가 HTML을 다시 만들고 Vercel이 배포한다. 1~2분 걸린다.
#
# 화면 라벨은 한국어(작가가 한국 사람), 입력하는 값은 독일어/영어(사이트는 독일 관객용).
# 그래서 항목마다 어느 언어로 써야 하는지 괄호로 적어 둔다.

media:
  - name: images
    label: 이미지
    input: content/images
    output: /content/images
    extensions: [jpg, jpeg, png, webp]
    categories: [image]

content:
  - name: works
    label: 작품
    type: collection
    path: content/works
    format: json
    filename:
      template: "{primary}.json"
      field: create
    view:
      fields: [title, year_label, medium_de]
      primary: title
      sort: [year, order, title]
      default:
        sort: year
        order: desc
    fields:
      - name: order
        label: 같은 해 안에서의 순서
        type: number
        required: true
        description: >
          작품 목록은 연도 내림차순(최신이 위)이다.
          이 숫자는 같은 해 작품끼리만 비교하며, 작을수록 위에 온다.
      - name: title
        label: 제목 (독일어)
        type: string
        required: true
        description: 사이트에 그대로 나가는 원제.
      - name: title_en
        label: 제목 (영어)
        type: string
        description: EN 화면에서 쓰인다. 비우면 EN 화면에서 빈칸으로 보일 수 있으니 채우는 편이 좋다.
      - name: year
        label: 연도
        type: number
        required: true
        description: 목록 정렬에 쓰는 숫자. 네 자리로 적는다.
      - name: year_label
        label: 연도 표기
        type: string
        description: 연도와 다르게 보여야 할 때만 입력. 예 2025–2026. 비우면 위 연도를 그대로 쓴다.
      - name: material_de
        label: 재료 (독일어)
        type: string
        description: 예 Reispapier, Kleiderbügel
      - name: material_en
        label: 재료 (영어)
        type: string
        description: 예 Rice paper, Clothes hanger
      - name: medium_de
        label: 매체·기법 (독일어)
        type: string
        description: 예 Fotografie, Installation, Video, 07:26 loop
      - name: medium_en
        label: 매체·기법 (영어)
        type: string
        description: 예 Photography, Installation, Video
      - name: text_de
        label: 작품 텍스트 (독일어)
        type: text
        description: 작품 페이지에서 제목 아래에 놓이는 설명 글.
      - name: text_en
        label: 작품 텍스트 (영어)
        type: text
      - name: layout
        label: 레이아웃
        type: object
        description: >
          작품 페이지의 이미지 배치. 전부 비워두면 지금 모양(왼쪽 정렬, 좁은 간격) 그대로다.
          휴대폰에서는 화면이 좁아 이미지가 항상 가로 전체를 쓰고, 큰 간격은 알맞게 줄어든다.
        fields:
          - name: align
            label: 이미지 정렬
            type: select
            description: 모든 이미지의 기본 정렬. 이미지마다 따로 바꿀 수도 있다. 비우면 왼쪽.
            options:
              placeholder: 왼쪽
              values:
                - name: left
                  label: 왼쪽
                - name: center
                  label: 가운데
                - name: right
                  label: 오른쪽
          - name: gap
            label: 이미지 사이 간격 (px)
            type: number
            description: 이미지와 이미지 사이의 빈 공간. 비우면 16. 참고로 32 보통, 64 넓게, 96 아주 넓게.
            options:
              min: 0
              max: 400
          - name: text_gap
            label: 글과 첫 이미지 사이 간격 (px)
            type: number
            description: 작품 텍스트(없으면 제목) 아래부터 첫 이미지까지. 비우면 글이 있을 때 96, 없을 때 64.
            options:
              min: 0
              max: 400
      - name: images
        label: 이미지
        type: object
        list: true
        fields:
          - name: src
            label: 이미지 파일
            type: image
            required: true
            options:
              media: images
          - name: width
            label: 크기 (%)
            type: number
            description: 본문 폭에 대한 가로 비율. 100이면 꽉 차게, 50이면 절반. 비우면 100.
            options:
              min: 10
              max: 100
          - name: align
            label: 정렬
            type: select
            description: 이 이미지만 다르게 놓고 싶을 때. 비우면 위 레이아웃의 이미지 정렬을 따른다.
            options:
              placeholder: 레이아웃 설정 따름
              values:
                - name: left
                  label: 왼쪽
                - name: center
                  label: 가운데
                - name: right
                  label: 오른쪽
          - name: caption_de
            label: 캡션 (독일어)
            type: string
            description: 연작처럼 사진마다 제목이 따로 있을 때만 입력. 예 Toast · Fotografie · 2025
          - name: caption_en
            label: 캡션 (영어)
            type: string

  - name: artist
    label: 작가 / 약력
    type: file
    path: content/artist.json
    format: json
    fields:
      - name: name
        label: 이름
        type: string
      - name: born
        label: 출생
        type: object
        fields:
          - name: year
            label: 연도
            type: number
          - name: place_de
            label: 지역 (독일어)
            type: string
          - name: place_en
            label: 지역 (영어)
            type: string
      - name: email
        label: 이메일
        type: string
        description: 연락처 페이지에 그대로 나간다.
      - name: place_de
        label: 연락처 하단 문구 (독일어)
        type: string
        description: 예 Boram Park — Saarbrücken, Deutschland
      - name: place_en
        label: 연락처 하단 문구 (영어)
        type: string
      - name: statement_de
        label: 약력 소개 글 (독일어)
        type: text
        description: 약력 페이지 맨 위에 놓이는 짧은 글.
      - name: statement_en
        label: 약력 소개 글 (영어)
        type: text
      - name: contact_note_de
        label: 연락처 페이지 안내 문구 (독일어)
        type: string
        description: 예 Für Ausstellungsanfragen und Presse.
      - name: contact_note_en
        label: 연락처 페이지 안내 문구 (영어)
        type: string
      - name: education
        label: 학력
        type: object
        list: true
        fields:
          - name: period
            label: 기간
            type: string
            description: 예 2019–2023
          - name: institution_de
            label: 학교 (독일어)
            type: string
          - name: institution_en
            label: 학교 (영어)
            type: string
          - name: degree_de
            label: 과정·학위 (독일어)
            type: string
          - name: degree_en
            label: 과정·학위 (영어)
            type: string
      - name: exhibitions
        label: 전시 이력
        type: object
        list: true
        fields:
          - name: year
            label: 연도
            type: number
          - name: title
            label: 전시명
            type: string
          - name: venue
            label: 장소
            type: string
          - name: source_note
            label: 내부 메모
            type: string
            description: 사이트에 나가지 않는다. 확인이 필요한 항목을 적어두는 칸.

  - name: site
    label: 홈 화면
    type: file
    path: content/site.json
    format: json
    fields:
      - name: cover_image
        label: 표지 이미지
        type: image
        options:
          media: images
      - name: cover_caption_title
        label: 표지 캡션 제목 (독일어)
        type: string
      - name: cover_caption_title_en
        label: 표지 캡션 제목 (영어)
        type: string
      - name: cover_caption_year
        label: 표지 캡션 연도
        type: string
      - name: cover_link_slug
        label: 표지를 누르면 열릴 작품
        type: string
        description: 작품 파일 이름에서 .json을 뺀 것. 예 haeutung-reispapier
      - name: tagline_de
        label: 이름 아래 문구 (독일어)
        type: string
        description: 비워두면 아무것도 나오지 않는다.
      - name: tagline_en
        label: 이름 아래 문구 (영어)
        type: string
