name: Seiten neu erzeugen

# Läuft nach jeder Änderung an content/ (auch nach dem Speichern im Pages CMS):
# Bilder aufbereiten -> HTML-Seiten neu schreiben -> zurück committen.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow installieren
        run: pip install --quiet pillow

      - name: Bilder aufbereiten
        run: python scripts/prepare-images.py

      - name: Seiten erzeugen
        run: python scripts/wire-content.py

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --staged; then
            echo "Keine Änderungen."
          else
            git commit -m "Seiten neu erzeugt [skip ci]"
            git push
          fi
