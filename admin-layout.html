<!doctype html>

</head>
<body data-section="layout">

  <nav class="masthead" aria-label="Kopfzeile">
    <div class="masthead-bar">
      <a class="nav-logo" href="index.html">Boram Park</a>
    </div>
  </nav>

  <main class="layout-main">
    <div class="layout-bar">
      <select id="werk" class="layout-select" aria-label="작품">
          <option value="uebergabe" data-path="content/works/uebergabe.json" data-page="werk-uebergabe.html">Übergabe</option>
          <option value="beruehrung" data-path="content/works/beruehrung.json" data-page="werk-beruehrung.html">Berührung</option>
          <option value="huelle" data-path="content/works/huelle.json" data-page="werk-huelle.html">Hülle</option>
          <option value="street-food" data-path="content/works/street-food.json" data-page="werk-street-food.html">Street Food (Serie)</option>
          <option value="haeutung-kleiderbuegel" data-path="content/works/haeutung-kleiderbuegel.json" data-page="werk-haeutung-kleiderbuegel.html">Häutung · Kleiderbügel</option>
          <option value="haeutung-reispapier" data-path="content/works/haeutung-reispapier.json" data-page="werk-haeutung-reispapier.html">Häutung · Reispapier</option>
          <option value="haeutung-leuchtkasten" data-path="content/works/haeutung-leuchtkasten.json" data-page="werk-haeutung-leuchtkasten.html">Häutung · Leuchtkasten</option>
          <option value="haeutung-kosmetikmaske" data-path="content/works/haeutung-kosmetikmaske.json" data-page="werk-haeutung-kosmetikmaske.html">Häutung · Kosmetikmaske</option>
          <option value="ein-monat" data-path="content/works/ein-monat.json" data-page="werk-ein-monat.html">Ein Monat</option>
          <option value="lebensfluss" data-path="content/works/lebensfluss.json" data-page="werk-lebensfluss.html">Lebensfluss</option>
          <option value="ein-hammer-installation" data-path="content/works/ein-hammer-installation.json" data-page="werk-ein-hammer-installation.html">Ein Hammer · Installation</option>
          <option value="ein-hammer-video" data-path="content/works/ein-hammer-video.json" data-page="werk-ein-hammer-video.html">Ein Hammer · Video</option>
      </select>
      <span class="layout-state" id="zustand">불러오는 중…</span>
      <div class="layout-lang" role="group" aria-label="Sprache">
        <button type="button" data-set-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
      <a class="layout-link" href="https://app.pagescms.org/">사진 올리러 가기</a>
      <button type="button" class="layout-save" id="speichern" disabled>저장</button>
    </div>

    <div class="layout-stage">
      <div class="work-blocks" id="buehne" data-repo="qbodrii-bit/Portfolio"></div>
    </div>

    <p class="layout-check" id="pruefung"></p>

    <details class="lay-key" id="schluessel">
      <summary>저장용 열쇠 <span class="lay-key-stand">열쇠 없음 — 지금은 보기만 됩니다</span></summary>
      <div class="lay-key-body">
        <p>저장하려면 GitHub 열쇠가 한 번 필요합니다. 이 브라우저에만 저장되고,
          사이트나 저장소에는 들어가지 않습니다.
          <strong>공용 컴퓨터에서는 쓰지 마세요.</strong></p>
        <p class="lay-key-zeile">
          <input type="password" class="lay-key-feld" autocomplete="off"
                 spellcheck="false" placeholder="열쇠를 붙여넣으세요">
          <button type="button" class="lay-key-save">등록</button>
          <button type="button" class="lay-key-weg">지우기</button>
        </p>
        <p class="lay-key-hilfe">열쇠가 만료되었을 때만 새로 만들면 됩니다 —
          <a href="https://github.com/settings/personal-access-tokens/new">새 열쇠 만들기</a> →
          Repository access는 <em>Only select repositories</em>에서 이 저장소,
          Permissions는 <em>Contents: Read and write</em> 하나만 켭니다.</p>
      </div>
    </details>

    <noscript><p class="layout-note">이 화면은 자바스크립트가 필요합니다.
      <a href="admin.html">관리 화면으로 돌아가기</a></p></noscript>
  </main>
  <script src="assets/admin-layout.js?v=8172102f"></script>
